name: CI

on:
  # Long-lived branches get a run on every push. Feature branches are covered
  # by their pull request, so this doesn't double up on every PR commit.
  push:
    branches: [main, staging]
  pull_request:

# A new push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The plan rules, which failed silently once: PRO's limits are `null` for
      # "unlimited", a `??` fallback read that as missing, and paying accounts
      # were held to the free limits. Nothing broke loudly — it built, it
      # typechecked, it rendered. Hence a test rather than a comment.
      - run: npm test

      # No DATABASE_URL or Clerk keys here on purpose: the repository layer
      # falls back to mock data without one (src/lib/repository.ts), auth is
      # guarded by isAuthConfigured (src/lib/auth.ts), and every page that
      # reads tenders is force-dynamic, so nothing touches Postgres at build
      # time. CI therefore needs no secrets.
      - run: npm run build
